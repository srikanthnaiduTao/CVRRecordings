<title>Team Recordings</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Roboto, -apple-system, Segoe UI, Arial, sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
  }

  /* ---- Top bar ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 10px 24px;
    background: #0f0f0f;
    border-bottom: 1px solid #272727;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .brand .logo {
    width: 30px;
    height: 21px;
    background: #ff0000;
    border-radius: 6px;
    position: relative;
    flex-shrink: 0;
  }
  .brand .logo::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-45%, -50%);
    border-style: solid;
    border-width: 5px 0 5px 8px;
    border-color: transparent transparent transparent #fff;
  }
  .search-wrap {
    flex: 1;
    max-width: 600px;
    display: flex;
  }
  .search-box {
    flex: 1;
    padding: 8px 14px;
    border-radius: 20px 0 0 20px;
    border: 1px solid #303030;
    border-right: none;
    background: #121212;
    color: #f1f1f1;
    font-size: 0.9rem;
    outline: none;
  }
  .search-box::placeholder {
    color: #888;
  }
  .search-btn {
    width: 44px;
    border-radius: 0 20px 20px 0;
    border: 1px solid #303030;
    background: #202020;
    color: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 14px 24px 0;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #aaaaaa;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn:hover {
    color: #f1f1f1;
  }
  .tab-btn.active {
    color: #f1f1f1;
    border-bottom-color: #ff0000;
  }
  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
  }
  .doc-icon-wrap {
    width: 100%;
  }
  svg.doc-icon.thumb-icon {
    width: 34%;
    height: 34%;
  }
  .empty-state {
    color: #888;
    padding: 40px 4px;
    text-align: center;
  }

  /* ---- Grid (list) view ---- */
  .content {
    padding: 20px 24px 60px;
  }
  .section-heading {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #aaaaaa;
    margin: 28px 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .section-heading::before,
  .section-heading::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #272727;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px 16px;
  }
  .card {
    cursor: pointer;
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
  }
  .thumb-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42%;
    height: 42%;
    opacity: 0.3;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
  }
  .play-icon {
    position: relative;
    z-index: 2;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .card:hover .play-icon {
    background: #ff0000;
    transform: scale(1.08);
  }
  .play-icon::after {
    content: "";
    border-style: solid;
    border-width: 10px 0 10px 16px;
    border-color: transparent transparent transparent #fff;
    margin-left: 4px;
  }
  .badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.8);
    color: #f1f1f1;
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .meta {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3ea6ff;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.85rem;
    color: #0f0f0f;
  }
  .meta-text .title {
    font-size: 0.92rem;
    font-weight: 500;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta-text .sub {
    font-size: 0.8rem;
    color: #aaaaaa;
    margin-top: 4px;
  }
  .no-results {
    color: #888;
    padding: 30px 4px;
  }

  /* ---- Player view: popup with blurred backdrop ---- */
  .player-view {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: rgba(15, 15, 15, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .player-view.open {
    display: flex;
  }
  .player-popup {
    width: 100%;
    max-width: 480px;
    background: #0f0f0f;
    border: 2px solid #ffffff;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.7);
  }
  .player-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .back-close-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #272727;
    border: none;
    color: #f1f1f1;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-close-btn:hover {
    background: #3a3a3a;
  }
  .player-title {
    font-size: 1.05rem;
    font-weight: 600;
  }
  .player-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .player-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .frame-close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    border: none;
    color: #f1f1f1;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 2;
  }
  .frame-close-btn:hover {
    background: rgba(255,0,0,0.85);
  }
  .player-fallback {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #aaaaaa;
  }
  .player-fallback a {
    color: #3ea6ff;
    text-decoration: none;
  }
  .login-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  .login-btn {
    background: #3ea6ff;
    color: #0f0f0f;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .login-btn:hover {
    background: #63b7ff;
  }

  /* thin scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f0f0f; }
  ::-webkit-scrollbar-thumb { background: #4a4a54; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #5c5c68; }
  * { scrollbar-width: thin; scrollbar-color: #4a4a54 #0f0f0f; }
</style>

function initials(title) {
  const words = title.trim().split(/\s+/).filter(Boolean);
  return ((words[0] || '')[0] || '').toUpperCase();
}

// ---- Topic-based thumbnail generation ----

const CATEGORIES = [
  { test: /devops|sonar|new relic|cribl|observability/i, icon: 'terminal', colors: ['#134e5e', '#71b280'] },
  { test: /react|git|dev team|nebula/i, icon: 'code', colors: ['#11998e', '#38ef7d'] },
  { test: /architecture/i, icon: 'layers', colors: ['#5f2c82', '#49a09d'] },
  { test: /fixed ops|inventory|ordering|qbb|parts master/i, icon: 'wrench', colors: ['#f7971e', '#ffd200'] },
  { test: /quer(y|ies)|clarification/i, icon: 'messageQuestion', colors: ['#ff9966', '#ff5e62'] },
  { test: /esign|signature/i, icon: 'pen', colors: ['#ee0979', '#ff6a00'] },
  { test: /account setup|user account/i, icon: 'userCog', colors: ['#00c6ff', '#0072ff'] },
  { test: /\bmd\b|maryland/i, icon: 'mapPin', colors: ['#f2994a', '#f2c94c'] },
  { test: /vaevr|virginia|\bva\b/i, icon: 'mapPin', colors: ['#4568dc', '#b06ab3'] },
  { test: /\bnc\b|carolina/i, icon: 'mapPin', colors: ['#cb2d3e', '#ef473a'] },
  { test: /\bsc\b/i, icon: 'mapPin', colors: ['#134e5e', '#71b280'] },
  { test: /demo/i, icon: 'monitorPlay', colors: ['#485563', '#29323c'] }
];
const DEFAULT_CATEGORY = { icon: 'monitorPlay', colors: ['#3a3a3a', '#1a1a1a'] };

function getCategory(title) {
  for (const cat of CATEGORIES) {
    if (cat.test.test(title)) return cat;
  }
  return DEFAULT_CATEGORY;
}

function thumbIconSvg(cat) {
  return '<svg class="thumb-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + ICONS[cat.icon] + '</svg>';
}

function renderGrid() {
  gridArea.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();
  const filtered = videos
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => v.title.toLowerCase().includes(term));

  if (!filtered.length) {
    gridArea.innerHTML = '<div class="no-results">No recordings match your search.</div>';
    return;
  }

  let lastSection = null;
  let gridDiv = null;

  filtered.forEach(({ v, i }) => {
    if (v.section && v.section !== lastSection) {
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.textContent = v.section;
      gridArea.appendChild(heading);
      gridDiv = document.createElement('div');
      gridDiv.className = 'grid';
      gridArea.appendChild(gridDiv);
    } else if (!gridDiv) {
      gridDiv = document.createElement('div');
      gridDiv.className = 'grid';
      gridArea.appendChild(gridDiv);
    }
    lastSection = v.section || lastSection;

    const cat = getCategory(v.title);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="thumb" style="background:linear-gradient(135deg, ' + cat.colors[0] + ', ' + cat.colors[1] + ')">' +
      thumbIconSvg(cat) +
      '<div class="play-icon"></div>' +
      (v.duration ? '<span class="badge">' + v.duration + '</span>' : '') +
      (v.summaryUrl ? '<span class="badge" style="left:8px;right:auto;">📄 Summary</span>' : '') +
      '</div>' +
      '<div class="meta">' +
        '<div class="avatar">' + initials(v.title) + '</div>' +
        '<div class="meta-text">' +
          '<div class="title">' + v.title + '</div>' +
          '<div class="sub">' + (v.date || 'Recording') + '</div>' +
        '</div>' +
      '</div>';
    card.onclick = () => openVideo(i);
    gridDiv.appendChild(card);
  });
}

function openVideo(i) {
  const v = videos[i];
  playerTitle.textContent = v.title;
  playerBody.innerHTML =
    '<div class="player-frame">' +
      '<button class="frame-close-btn" id="frameCloseBtn" title="Close">&#10005;</button>' +
      '<iframe src="' + v.embedUrl + '" allowfullscreen title="' + v.title + '"></iframe>' +
    '</div>' +
    '<div class="player-fallback">Video not loading? <a href="' + v.fileUrl + '" target="_blank">Open it directly in SharePoint instead</a>.</div>' +
    (v.summaryUrl ? '<div class="player-fallback"><a href="' + v.summaryUrl + '" target="_blank">📄 View meeting summary (PDF)</a></div>' : '');

  document.getElementById('frameCloseBtn').addEventListener('click', closeVideo);

  playerView.classList.add('open');
}

function closeVideo() {
  playerView.classList.remove('open');
  playerBody.innerHTML = '';
}

backBtn.addEventListener('click', closeVideo);
playerView.addEventListener('click', (e) => {
  if (e.target === playerView) closeVideo();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && playerView.classList.contains('open')) closeVideo();
});

searchBox.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderGrid();
  renderDocsGrid();
});

// ---- Documents tab ----
const DOC_ICONS = {
  pdf:  { colors: ['#8e2de2', '#cc2b5e'], label: 'PDF' },
  docx: { colors: ['#2b5876', '#4e4376'], label: 'DOC' },
  xlsx: { colors: ['#11998e', '#38ef7d'], label: 'XLS' },
  pptx: { colors: ['#f7971e', '#ffd200'], label: 'PPT' },
  doc:  { colors: ['#485563', '#29323c'], label: 'DOC' }
};

function docIconSvg() {
  return '<svg class="thumb-icon doc-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
    '<polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>' +
    '<line x1="8" y1="9" x2="10" y2="9"/></svg>';
}

function renderDocsGrid() {
  docsGridArea.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();
  const filtered = documents.filter((d) => d.title.toLowerCase().includes(term));

  if (!documents.length) {
    docsGridArea.innerHTML = '<div class="empty-state">No documents yet — check back soon.</div>';
    return;
  }
  if (!filtered.length) {
    docsGridArea.innerHTML = '<div class="no-results">No documents match your search.</div>';
    return;
  }

  const gridDiv = document.createElement('div');
  gridDiv.className = 'grid';
  docsGridArea.appendChild(gridDiv);

  filtered.forEach((d) => {
    const style = DOC_ICONS[d.type] || DOC_ICONS.doc;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="thumb" style="background:linear-gradient(135deg, ' + style.colors[0] + ', ' + style.colors[1] + ')">' +
      docIconSvg() +
      '<span class="badge">' + style.label + '</span>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="avatar">' + initials(d.title) + '</div>' +
        '<div class="meta-text">' +
          '<div class="title">' + d.title + '</div>' +
          '<div class="sub">' + (d.date || 'Document') + '</div>' +
        '</div>' +
      '</div>';
    card.onclick = () => window.open(d.fileUrl, '_blank');
    gridDiv.appendChild(card);
  });
}

function switchTab(tab) {
  const showVideos = tab === 'videos';
  tabVideosBtn.classList.toggle('active', showVideos);
  tabDocsBtn.classList.toggle('active', !showVideos);
  videosPanel.classList.toggle('active', showVideos);
  docsPanel.classList.toggle('active', !showVideos);
}

tabVideosBtn.addEventListener('click', () => switchTab('videos'));
tabDocsBtn.addEventListener('click', () => switchTab('documents'));

renderDocsGrid();

renderGrid();
